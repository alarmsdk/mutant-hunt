<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{admin.login.title}">Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="student-body">
<main class="screen">
    <div class="card login-card">
        <h1 class="logo">🔒 <span th:text="#{admin.login.title}">Admin Login</span></h1>
        <div th:if="${param.error}" class="alert alert-error" th:text="#{admin.login.error}">Invalid password.</div>
        <div th:if="${param.logout}" class="alert alert-info" th:text="#{admin.login.loggedOut}">Signed out.</div>
        <div th:if="${param.blocked}" class="alert alert-error" th:text="#{admin.login.blocked}">Too many attempts.</div>
        <form th:action="@{/admin/login}" method="post" autocomplete="off">
            <div class="field">
                <label for="password" th:text="#{admin.login.password}">Password</label>
                <input id="password" name="password" type="password" required autofocus autocomplete="current-password"/>
                <input type="hidden" name="username" value="admin"/>
            </div>
            <button type="submit" class="btn btn-primary btn-full" th:text="#{admin.login.button}">Sign In</button>
        </form>
    </div>
</main>
</body>
</html>
