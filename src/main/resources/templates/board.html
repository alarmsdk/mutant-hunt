<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{board.title}">Mutant Hunt – Board</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="board-body">
<div id="conn-banner" class="conn-banner" style="display:none" th:text="#{common.connection.lost}"></div>
<div id="board" class="board">

    <!-- Join panel: QR + URL + participant count -->
    <aside id="qr-section" class="board-qr">
        <h1 class="board-title">🧬 <span th:text="#{board.title}">Mutant Hunt</span></h1>
        <p class="board-scan" th:text="#{board.scan}">Scan to join</p>
        <img id="qr-img" th:src="@{/api/qr(size=800)}" alt="QR code"/>
        <p class="join-url" id="join-url" th:text="${joinUrl}"></p>
        <p id="board-participants" class="board-stat-big"></p>
    </aside>

    <!-- Round panel -->
    <main id="round-section" class="board-main">
        <div id="no-session" class="board-empty" style="display:none">
            <h2 th:text="#{board.noSession}">No active session</h2>
        </div>
        <div id="no-round" class="board-empty" style="display:none">
            <h2 id="session-name"></h2>
            <p th:text="#{board.noRound}">Waiting for the first round…</p>
        </div>

        <div id="round-content" style="display:none">
            <header class="board-header">
                <h2 id="round-name" class="board-round-name"></h2>
                <span id="round-status" class="board-status"></span>
                <div class="board-meta">
                    <span id="board-test-limit" class="board-stat"></span>
                    <span id="board-participant-count" class="board-stat"></span>
                    <span id="board-timer" class="board-stat timer" style="display:none"></span>
                </div>
            </header>

            <div class="board-grid">
                <section class="board-spec-wrap">
                    <div id="board-spec" class="board-spec"></div>
                    <div id="mutant-panel" class="board-mutants" style="display:none">
                        <h3 th:text="#{board.mutants.title}">Mutants</h3>
                        <div id="mutant-list"></div>
                        <p id="mutant-note" class="muted small" style="display:none"
                           th:text="#{board.mutants.detailsAfterReveal}"></p>
                    </div>
                </section>

                <section class="board-scoreboard">
                    <h3 th:text="#{board.scoreboard.title}">Scoreboard</h3>
                    <table id="scoreboard-table">
                        <thead>
                        <tr>
                            <th th:text="#{board.rank}">#</th>
                            <th th:text="#{board.name}">Name</th>
                            <th th:text="#{board.score}">Killed</th>
                            <th th:text="#{board.tests}">Tests</th>
                        </tr>
                        </thead>
                        <tbody id="scoreboard-body"></tbody>
                    </table>
                    <p id="scoreboard-empty" class="muted" style="display:none" th:text="#{board.scoreboard.empty}"></p>
                    <div id="scoreboard-more" class="more-label" style="display:none"></div>
                </section>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">window.MSG = /*[[${messages}]]*/ {};</script>
<script th:src="@{/js/i18n.js}"></script>
<script th:src="@{/js/board.js}"></script>
</body>
</html>
