# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ── Datasource (H2 file) ───────────────────────────────
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/mutanthunt;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=30

# ── Thymeleaf ──────────────────────────────────────────
spring.thymeleaf.cache=true

# ── App-specific ───────────────────────────────────────
app.admin-password=${ADMIN_PASSWORD:changeme}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}
app.default-student-id-length=${STUDENT_ID_LENGTH:10}
app.default-rate-limit-ms=${RATE_LIMIT_MS:2000}

# ── Logging ────────────────────────────────────────────
logging.level.com.seng403.mutanthunt=INFO
