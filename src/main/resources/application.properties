# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Keep the admin logged in for a whole lecture day
server.servlet.session.timeout=12h

# ── Datasource (H2 file) ───────────────────────────────
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/mutanthunt;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=30

# ── Thymeleaf / messages ───────────────────────────────
spring.thymeleaf.cache=true
# All UI texts live in messages.properties (add messages_tr.properties for Turkish)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ── Scheduling (SSE heartbeat, scoreboard flush, round timer) ──
spring.task.scheduling.pool.size=3

# ── App-specific ───────────────────────────────────────
app.admin-password=${ADMIN_PASSWORD:changeme}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}
app.default-student-id-length=${STUDENT_ID_LENGTH:10}
app.default-rate-limit-ms=${RATE_LIMIT_MS:2000}

# ── Logging ────────────────────────────────────────────
logging.level.com.seng403.mutanthunt=INFO
