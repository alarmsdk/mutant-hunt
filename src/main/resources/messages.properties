# ═══════════════════════════════════════════════════════
# Mutant Hunt – UI Messages (English)
#
# Every text of the student page, the board and the admin panel lives here.
# Templates use #{key}; JavaScript receives the same map as window.MSG and
# fills {0}, {1}, … placeholders itself.
# To add Turkish, copy this file to messages_tr.properties and translate the
# values (keep the keys). Browsers sending Accept-Language: tr get it automatically.
# ═══════════════════════════════════════════════════════

